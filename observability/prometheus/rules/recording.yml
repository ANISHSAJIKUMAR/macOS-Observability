groups:
  - name: laptop_recording_rules
    interval: 30s
    rules:
      - record: job:node_cpu_usage_percent:rate5m
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance)) * 100

      - record: job:node_memory_used_percent
        expr: (node_memory_total_bytes - node_memory_free_bytes - node_memory_inactive_bytes - node_memory_purgeable_bytes) / node_memory_total_bytes * 100

      - record: job:node_filesystem_used_percent
        expr: (1 - node_filesystem_avail_bytes{fstype!~"autofs"} / node_filesystem_size_bytes{fstype!~"autofs"}) * 100

      - record: job:node_network_receive_bps
        expr: rate(node_network_receive_bytes_total[5m])

      - record: job:node_network_transmit_bps
        expr: rate(node_network_transmit_bytes_total[5m])

      - record: job:net_ping_loss_percent
        expr: net_ping_loss_percent
