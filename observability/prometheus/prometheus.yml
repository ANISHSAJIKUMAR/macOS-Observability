---
global:
  scrape_interval: 15s

# Rule files - use absolute path, configured by setup.sh
# For local development, rules are in: ./rules/*.yml
rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: "prometheus"
    # static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node_exporter"
    # static_configs:
      - targets: ["localhost:9100"]
    # Note: node_exporter includes custom macOS metrics via textfile collector
    # Available metrics: battery, network connectivity, system info, LaunchD, etc.

  # - job_name: "promtail" # Disabled
    # static_configs:
      # - targets: ["localhost:9080"]
