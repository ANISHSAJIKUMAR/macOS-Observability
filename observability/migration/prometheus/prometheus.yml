---
global:
  scrape_interval: 15s

rule_files:
  - /Users/anishskumar/Anish-DevOps-Lab/observability/prometheus/rules/*.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "node_exporter"
    static_configs:
      - targets: ["localhost:9100"]
  - job_name: "promtail"
    static_configs:
      - targets: ["localhost:9080"]
