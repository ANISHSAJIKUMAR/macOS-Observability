name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/observability.tar.gz observability

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: observability-archive
          path: dist/observability.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/observability.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
