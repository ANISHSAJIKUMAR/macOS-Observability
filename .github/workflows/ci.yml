---
name: ci

"on":
  push:
    paths-ignore:
      - "**/*.md"
      - "observability/docs/**"
      - "observability/output/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "observability/docs/**"
      - "observability/output/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      prom: ${{ steps.filter.outputs.prom }}
      docker: ${{ steps.filter.outputs.docker }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - name: Force full run on main
        id: force
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lint:
              - '.github/workflows/**'
              - 'observability/**/*.yml'
              - 'observability/**/*.yaml'
              - 'observability/**/*.json'
              - 'observability/**/*.sh'
              - 'observability/**/*.py'
            prom:
              - 'observability/prometheus/**'
              - 'observability/migration/prometheus/**'
            docker:
              - 'observability/migration/docker-compose.yml'
              - 'observability/migration/**'
            security:
              - '.github/workflows/**'
              - '.gitleaks.toml'
              - 'observability/**'
              - '!observability/docs/**'
              - '!observability/output/**'

      - name: Override outputs (main push)
        if: ${{ steps.force.outputs.all == 'true' }}
        run: |
          echo "lint=true" >> "$GITHUB_OUTPUT"
          echo "prom=true" >> "$GITHUB_OUTPUT"
          echo "docker=true" >> "$GITHUB_OUTPUT"
          echo "security=true" >> "$GITHUB_OUTPUT"

  lint-and-validate:
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/workflows/ci.yml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            .github/workflows/ci.yml

      - name: Cache apt
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Cache Homebrew (macOS only)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Determine changed files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
            files=$(git diff --name-only "$base" "${{ github.sha }}")
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              files=$(git ls-files)
            else
              files=$(git diff --name-only "$before" "${{ github.sha }}")
            fi
          fi
          printf "%s\n" "$files" > /tmp/changed_files.txt
          echo "count=$(wc -l < /tmp/changed_files.txt)" >> "$GITHUB_OUTPUT"

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends jq shellcheck
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade --quiet yamllint ruff pytest

      - name: YAML lint
        run: |
          files=$(grep -E '\.ya?ml$' /tmp/changed_files.txt || true)
          if [ -z "$files" ]; then
            files=$(find observability .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \))
          fi
          if [ -n "$files" ]; then
            yamllint -d '{extends: default, rules: {line-length: {max: 200}}}' $files
          fi

      - name: JSON validation (dashboards)
        run: |
          files=$(grep -E 'grafana/.+\\.json$' /tmp/changed_files.txt || true)
          if [ -z "$files" ]; then
            files="observability/grafana/dashboards/*.json observability/migration/grafana/dashboards/*.json"
          fi
          for f in $files; do
            [ -f "$f" ] || continue
            jq -e . "$f" >/dev/null
          done

      - name: Grafana dashboard schema validation
        run: |
          files=$(grep -E 'grafana/.+\\.json$' /tmp/changed_files.txt || true)
          if [ -z "$files" ]; then
            files="observability/grafana/dashboards/*.json observability/migration/grafana/dashboards/*.json"
          fi
          for f in $files; do
            [ -f "$f" ] || continue
            npx --yes ajv-cli validate -s observability/grafana/schema/dashboard.schema.json -d "$f"
          done

      - name: Shellcheck
        run: |
          files=$(grep -E '\\.sh$' /tmp/changed_files.txt || true)
          if [ -z "$files" ]; then
            files="observability/*.sh observability/tools/*.sh"
          fi
          shellcheck $files

      - name: Python syntax check
        run: |
          files=$(grep -E 'observability/exporters/.+\\.py$' /tmp/changed_files.txt || true)
          if [ -z "$files" ]; then
            files="observability/exporters/*.py"
          fi
          python3 -m py_compile $files

      - name: Python lint (ruff)
        run: |
          files=$(grep -E 'observability/exporters/.+\\.py$' /tmp/changed_files.txt || true)
          if [ -z "$files" ]; then
            ruff check observability/exporters
          else
            ruff check $files
          fi

      - name: Exporter unit tests (pytest)
        run: |
          pytest -q observability/exporters/tests

  prometheus-validate:
    needs: changes
    if: ${{ needs.changes.outputs.prom == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache promtool
        uses: actions/cache@v4
        with:
          path: /tmp/promtool
          key: promtool-2.52.0

      - name: Prometheus promtool check
        run: |
          PROM_VER=2.52.0
          if [ ! -x /tmp/promtool/promtool ]; then
            curl -L -o /tmp/prom.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${PROM_VER}/prometheus-${PROM_VER}.linux-amd64.tar.gz"
            tar -xzf /tmp/prom.tar.gz -C /tmp
            mkdir -p /tmp/promtool
            cp "/tmp/prometheus-${PROM_VER}.linux-amd64/promtool" /tmp/promtool/promtool
          fi
          /tmp/promtool/promtool check config observability/prometheus/prometheus.yml
          if [ -d observability/prometheus/rules ]; then
            /tmp/promtool/promtool check rules observability/prometheus/rules/*.yml || true
          fi

  docker-validate:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Docker Compose config
        run: |
          docker compose -f observability/migration/docker-compose.yml config -q

  security-scan:
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
