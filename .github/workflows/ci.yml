---
name: ci

"on":
  push:
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck curl
          python3 -m pip install --upgrade pip
          python3 -m pip install yamllint ruff

      - name: YAML lint
        run: |
          files=$(find observability .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \))
          if [ -n "$files" ]; then
            yamllint -d '{extends: default, rules: {line-length: {max: 200}}}' $files
          fi

      - name: JSON validation (dashboards)
        run: |
          for f in observability/grafana/dashboards/*.json observability/migration/grafana/dashboards/*.json; do
            [ -f "$f" ] || continue
            jq -e . "$f" >/dev/null
          done

      - name: Shellcheck
        run: |
          shellcheck observability/*.sh observability/tools/*.sh

      - name: Python syntax check
        run: |
          python3 -m py_compile observability/exporters/*.py

      - name: Python lint (ruff)
        run: |
          ruff check observability/exporters

  prometheus-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prometheus promtool check
        run: |
          PROM_VER=2.52.0
          curl -L -o /tmp/prom.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${PROM_VER}/prometheus-${PROM_VER}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /tmp
          /tmp/prometheus-${PROM_VER}.linux-amd64/promtool check config observability/prometheus/prometheus.yml
          if [ -d observability/prometheus/rules ]; then
            /tmp/prometheus-${PROM_VER}.linux-amd64/promtool check rules observability/prometheus/rules/*.yml || true
          fi

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Compose config
        run: |
          docker compose -f observability/migration/docker-compose.yml config -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
